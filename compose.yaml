name: wisata-daerah

services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
      BACKEND_INTERNAL_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-wisata_daerah}
      DB_USERNAME: ${MYSQL_USER:-wisata_daerah}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me-local-only}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
      - ./infra/docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "artisan", "about", "--only=environment"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: ${MYSQL_DATABASE:-wisata_daerah}
      DB_USERNAME: ${MYSQL_USER:-wisata_daerah}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me-local-only}
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    extends:
      service: worker
    command: php artisan schedule:work

  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wisata_daerah}
      MYSQL_USER: ${MYSQL_USER:-wisata_daerah}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-local-only}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-me-root-local-only}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  backend_vendor:
  frontend_node_modules:
  mysql_data:
